<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVII Congreso Nacional de Mastozoología — Programa</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=zilla-slab:400,600,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #7a4a21;
    --border: #e4dfd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Zilla Slab', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 1.2rem 1.5rem;
  }
  header h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: .25rem 0 0; font-size: .9rem; opacity: .9; }
  .container { max-width: 960px; margin: 0 auto; padding: 1rem 1rem 6rem; }

  .filters {
    display: flex; flex-wrap: wrap; gap: .6rem;
    margin: 1rem 0; align-items: center;
  }
  .filters input[type="search"] {
    flex: 1 1 220px;
    padding: .5rem .7rem;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
  }
  .filters .field { display: flex; flex-direction: column; gap: .15rem; }
  .filters .field-label {
    font-size: .68rem;
    color: var(--muted);
    letter-spacing: .03em;
    padding-left: .15rem;
  }
  .filters select {
    padding: .5rem;
    font-size: .95rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    background: #fff;
  }
  .day-tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0 1rem; }
  .day-tabs button {
    border: 1px solid var(--border);
    background: #fff;
    padding: .45rem .85rem;
    border-radius: 999px;
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
  }
  .day-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .day-tabs .now-btn { border-style: dashed; font-weight: bold; }

  .only-sel {
    border: 1px solid var(--border);
    background: #fff;
    padding: .45rem .85rem;
    border-radius: 999px;
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
  }
  .only-sel.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .event {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem 1rem;
    margin-bottom: .6rem;
    scroll-margin-top: 3.2rem;
    display: grid;
    grid-template-columns: 70px 1fr auto;
    gap: .8rem;
    align-items: start;
  }
  h2 {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    margin: 0 0 .6rem;
    padding: .4rem 0;
    font-size: 1.1rem;
  }
  .event.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .event .time { font-weight: bold; font-size: 1rem; color: var(--accent); }
  .event .venue { font-size: .8rem; color: var(--muted); }
  .event h3 { margin: 0 0 .2rem; font-size: 1.02rem; }
  .event .authors { font-size: .85rem; color: var(--muted); margin: .15rem 0; }
  .badge {
    display: inline-block;
    font-size: .72rem;
    padding: .12rem .5rem;
    border-radius: 999px;
    margin-right: .35rem;
    background: #efe6da;
    color: var(--accent);
    font-weight: bold;
  }
  .badge.logistica { background: #e2e2e2; color: #555; }
  .badge.simposio { background: #dfe8f5; color: #2d4f8b; }
  .badge.cartel { background: #e3f2e3; color: #2e6b34; }
  .badge.magistral { background: #f5e3df; color: #8b3a2d; }
  .session-name { font-size: .8rem; color: var(--muted); font-style: italic; margin-top: .15rem; }
  .clash {
    display: inline-block;
    font-size: .72rem;
    font-weight: bold;
    padding: .12rem .5rem;
    border-radius: 999px;
    margin-top: .25rem;
    background: #fdecea;
    color: #8b3a2d;
  }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 .6rem; }
  .empty { text-align: center; color: var(--muted); padding: 3rem 0; }
  .notice {
    margin-top: .9rem;
    font-size: .8rem;
    color: var(--muted);
    background: #efece4;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .5rem .8rem;
    line-height: 1.45;
  }
  .notice a { color: var(--accent); font-weight: 600; }
  .hint { font-size: .8rem; color: var(--muted); margin: 0 0 .4rem; }

  .pick {
    justify-self: end;
    align-self: start;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    font-family: inherit;
    font-size: .8rem;
    padding: .25rem .65rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pick.on { background: var(--accent); color: #fff; }

  .tray {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(960px, 100%);
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .6rem 1rem;
    font-size: .95rem;
    box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    z-index: 10;
  }
  .tray-download {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: .5rem .9rem;
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
  }
  .tray-clear {
    background: none;
    border: 0;
    color: var(--muted);
    font-family: inherit;
    font-size: .9rem;
    cursor: pointer;
    text-decoration: underline;
  }

    .qr-btn {
    margin-top: .6rem;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 999px;
    padding: .35rem .8rem;
    font-family: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  .qr-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .qr-modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.2rem 1.4rem;
    text-align: center; max-width: 320px; width: 100%;
  }
  .qr-modal h3 { margin: 0 0 .8rem; font-size: 1rem; }
  .qr-modal canvas { max-width: 100%; height: auto; }
  .qr-url { font-size: .75rem; color: var(--muted); word-break: break-all; margin: .6rem 0 .8rem; }
  .qr-close {
    background: var(--accent); color: #fff; border: 0;
    border-radius: 6px; padding: .45rem .9rem;
    font-family: inherit; font-size: .9rem; cursor: pointer;
  }

  @media (max-width: 540px) {
    .event { grid-template-columns: 1fr; gap: .2rem; }
    .pick { justify-self: start; margin-top: .4rem; }
  }
</style>
</head>
<body>
<div id="root">
  <div id="fallback" style="max-width:640px;margin:2rem auto;padding:1rem 1.25rem;background:#efece4;border:1px solid #e4dfd4;border-radius:8px;font-family:Georgia,serif;font-size:95%;line-height:1.5;color:#2b2b2b;">
    <p style="margin:0 0 .5rem;"><strong>Cargando el programa…</strong></p>
    <p id="fallback-tip" style="margin:0;color:#6b6b6b;display:none;">
      La página sigue cargando. Si no aparece en un minuto:
      revisa tu conexión, prueba recargar (o abrir en otro navegador como Chrome o Safari),
      y reporta lo siguiente al equipo de organización:
    </p>
    <p id="fallback-diag" style="margin:.4rem 0 0;display:none;font-size:.8rem;word-break:break-word;color:#6b6b6b;"></p>
  </div>
</div>
<noscript>
  <div style="max-width:640px;margin:2rem auto;padding:1rem;font-family:Georgia,serif;">
    Esta página requiere JavaScript. Actívalo en tu navegador para ver el programa.
  </div>
</noscript>
<script>
// Diagnóstico: captura errores de carga/ejecución y los muestra en pantalla
(function () {
  var diag = document.getElementById("fallback-diag");
  var tip = document.getElementById("fallback-tip");
  var report = function (msg) {
    tip.style.display = "block";
    diag.style.display = "block";
    diag.textContent = msg + " · Navegador: " + navigator.userAgent;
  };
  window.addEventListener("error", function (e) {
    var m = e.message || ("Error al cargar " + (e.target && e.target.src || e.target && e.target.href || "un recurso"));
    report(m);
  }, true);
  window.__diag = report;
  setTimeout(function () {
    if (document.getElementById("fallback")) {
      report("La aplicación no se inició en 20 segundos (posible conexión lenta o archivo incompleto)");
    }
  }, 20000);
})();
</script>
<script src="program.js" onerror="window.__diag && window.__diag('No se pudo descargar program.js')"></script>
<script src="app.js" defer onerror="window.__diag && window.__diag('No se pudo descargar app.js')"></script>
</body>
</html>
